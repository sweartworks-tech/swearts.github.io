 const rel=document.createElement('section');rel.className='related';rel.innerHTML='<div class="container"><div class="eyebrow">You may also like</div><h2>More from the collection</h2><div class="related-grid"></div></div>';page.appendChild(rel);related.forEach(x=>{const ael=document.createElement('a');ael.href='artwork.html?id='+encodeURIComponent(x.id||x.title);ael.innerHTML='<img src="'+esc(x.image||'')+'" alt="'+esc(x.title)+'"><h3>'+esc(x.title)+'</h3><p>'+esc(x.price||'Enquire')+'</p>';rel.querySelector('.related-grid').appendChild(ael)});
 const schema={'@context':'https://schema.org','@type':'Product',name:a.title,image:photos,description:a.story||a.type||'',category:a.category||'Handcrafted art',brand:{'@type':'Brand',name:'SweArts'},offers:{'@type':'Offer',availability:a.status==='sold'?'https://schema.org/SoldOut':'https://schema.org/InStock',priceCurrency:'USD',price:String(a.price||'').replace(/[^0-9.]/g,'')||undefined}};$('#product-schema').textContent=JSON.stringify(schema);
